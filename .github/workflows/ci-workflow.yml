name: j-pet-continuous-integration-tests
on: [push, pull_request]

jobs:
  build_and_run_all_tests_on_ubuntu:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-20.04]

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: system update
      run: |
       sudo apt-get -qq update
       sudo apt-get install -y git libboost-all-dev libtbb-dev cmake libfftw3-dev sshpass nlohmann-json3-dev
      #  libfftw3-3

    - name: set branch name
      run: |
        echo "GITHUB_REF=${GITHUB_REF}"
        GITHUB_BRANCH=${GITHUB_REF##*\/}
        if [ "${GITHUB_BRANCH}" = "master" ]; then echo "BRANCH=master" | tee ${GITHUB_ENV};
        else echo "BRANCH=develop" | tee ${GITHUB_ENV};
        fi

    - name: download  ROOT (for ubuntu-24.04)
      run: |
        sudo apt-get install libvdt-dev
        wget https://root.cern/download/root_v6.36.04.Linux-ubuntu24.04-x86_64-gcc13.3.tar.gz
        tar xzf root_v6.36.04.Linux-ubuntu24.04-x86_64-gcc13.3.tar.gz
      if: matrix.os == 'ubuntu-24.04'

    - name: download  ROOT (for ubuntu 22.04)
      run: |
        wget https://root.cern/download/root_v6.30.02.Linux-ubuntu22.04-x86_64-gcc11.4.tar.gz
        tar xzf root_v6.30.02.Linux-ubuntu22.04-x86_64-gcc11.4.tar.gz
      if: matrix.os == 'ubuntu-22.04'

    - name: download  ROOT (for ubuntu 20.04)
      run: |
        wget https://root.cern/download/root_v6.24.02.Linux-ubuntu20-x86_64-gcc9.3.tar.gz
        tar xzf root_v6.24.02.Linux-ubuntu20-x86_64-gcc9.3.tar.gz
      if: matrix.os == 'ubuntu-20.04'

    - name: build j-pet framework
      run: |
        source root/bin/thisroot.sh
        rm -rf j-pet-framework || true
        git clone --single-branch --branch ${BRANCH} https://github.com/JPETTomography/j-pet-framework.git
        mkdir -p j-pet-framework/build
        cd j-pet-framework/
        git submodule update --init --recursive
        cd build
        cmake ..
        cmake --build . -j $(nproc)
        cd ../..

    - name: build framework examples
      run: |
        source root/bin/thisroot.sh
        source j-pet-framework/build/bin/thisframework.sh
        git submodule update --init --recursive
        mkdir build
        cd build
        cmake ..
        make -j $(nproc)
        make tests_commontools
        make tests_imagereconstruction
        make tests_listmodeexport

    - name: run image reconstruction test
      run: |
        source root/bin/thisroot.sh
        cd build/ImageReconstruction
        ctest -j6 -C Debug -T test --output-on-failure

    - name: run listmode export test
      run: |
        source root/bin/thisroot.sh
        cd build/ListmodeExport
        ctest -j6 -C Debug -T test --output-on-failure

    - name: run common tools tests
      run: |
        source root/bin/thisroot.sh
        cd build/CommonTools
        ctest -j6 -C Debug -T test --output-on-failure

